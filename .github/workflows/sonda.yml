name: sonda-es
# Comprueba si las fuentes espanolas responden desde los runners de GitHub (que estan en EE.UU.).
# Deja el resultado en sonda-resultado.md dentro del repo, porque la descarga de registros por API
# redirige a un servidor que no siempre es accesible.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sondear
        run: |
          set +e
          R=sonda-resultado.md
          { echo "# Sonda de fuentes desde GitHub Actions"; echo; echo "Ejecutada: $(date -u '+%Y-%m-%d %H:%M UTC')"; echo; } > $R

          echo "## Runner" >> $R
          echo '```' >> $R
          curl -sS -m 30 https://ipinfo.io/json >> $R 2>&1 || echo "(no disponible)" >> $R
          echo '```' >> $R; echo >> $R

          echo "## BDNS" >> $R
          echo '```' >> $R
          U="https://www.infosubvenciones.es/bdnstrans/api/convocatorias/busqueda?vpd=GE&order=fechaRecepcion&direccion=desc&page=0&pageSize=10&fechaDesde=01%2F09%2F2026&fechaHasta=25%2F09%2F2026&finalidad=13"
          curl -sS -m 90 -o /tmp/b.json -w "HTTP %{http_code} en %{time_total}s, %{size_download} bytes\n" \
            -H "Accept: application/json" -H "User-Agent: Mozilla/5.0 RadarGHC" "$U" >> $R 2>&1
          head -c 200 /tmp/b.json >> $R 2>/dev/null; echo >> $R
          python3 -c "import json;d=json.load(open('/tmp/b.json'));print('CONVOCATORIAS DEVUELTAS:',len(d.get('content',[])))" >> $R 2>&1 \
            || echo "no se ha podido interpretar la respuesta" >> $R
          echo '```' >> $R; echo >> $R

          echo "## PLACSP" >> $R
          echo '```' >> $R
          for U in \
            "https://contrataciondelestado.es/sindicacion/sindicacion_643/licitacionesPerfilesContratanteCompleto3.atom" \
            "https://contrataciondelestado.es/sindicacion/sindicacion_1044/PlataformasAgregadasSinMenores.atom" ; do
            echo "== $(basename $U)" >> $R
            curl -sS -m 150 -o /tmp/p.xml -w "   HTTP %{http_code} en %{time_total}s, %{size_download} bytes\n" \
              -H "User-Agent: Mozilla/5.0 RadarGHC" "$U" >> $R 2>&1
            echo "   entries: $(grep -c '<entry' /tmp/p.xml 2>/dev/null)" >> $R
            head -c 150 /tmp/p.xml >> $R 2>/dev/null; echo >> $R
          done
          echo '```' >> $R; echo >> $R

          echo "## BOE" >> $R
          echo '```' >> $R
          curl -sS -m 60 -o /tmp/boe.json -w "HTTP %{http_code} en %{time_total}s\n" \
            -H "Accept: application/json" "https://www.boe.es/datosabiertos/api/boe/sumario/20260922" >> $R 2>&1
          head -c 150 /tmp/boe.json >> $R 2>/dev/null; echo >> $R
          echo '```' >> $R; echo >> $R

          echo "## SMTP ticaas (puerto 587 de salida)" >> $R
          echo '```' >> $R
          timeout 20 bash -c 'exec 3<>/dev/tcp/smtp.ticaas.net/587 && head -1 <&3' >> $R 2>&1 \
            && echo "587 ABIERTO" >> $R || echo "587 CERRADO o no resuelve" >> $R
          echo '```' >> $R

          cat $R

      - name: Guardar el resultado en el repositorio
        run: |
          git config user.name "Radar GHC"
          git config user.email "radar@ghcneutral.com"
          git add sonda-resultado.md
          git commit -m "Resultado de la sonda de fuentes" || echo "sin cambios"
          git push
