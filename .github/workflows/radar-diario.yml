name: Radar diario

# Rastrea, publica el panel y manda los avisos por correo. Se ejecuta en los servidores de GitHub,
# asi que NO hace falta que ningun PC de la empresa este encendido.
#
# 06:30 UTC = 08:30 hora peninsular en horario de verano, 07:30 en invierno.
# GitHub puede retrasar las ejecuciones programadas en horas punta; para un aviso diario da igual.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      ensayo:
        description: 'Mandar ademas un aviso de ENSAYO a cada suscriptor (no cuenta como enviado)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r app/requirements.txt

      - name: Traer la base de datos de la rama datos
        run: |
          mkdir -p app/data
          git fetch --depth 1 origin datos
          git show origin/datos:subvenciones.sqlite.gz > /tmp/base.gz
          gunzip -c /tmp/base.gz > app/data/subvenciones.sqlite
          ls -la app/data/
          python3 -c "
          import sqlite3
          c=sqlite3.connect('app/data/subvenciones.sqlite')
          print('convocatorias:', c.execute('SELECT COUNT(*) FROM convocatorias').fetchone()[0])
          print('licitaciones :', c.execute('SELECT COUNT(*) FROM licitaciones').fetchone()[0])
          print('suscriptores :', c.execute('SELECT COUNT(*) FROM suscripciones').fetchone()[0])
          "

      - name: Ajustar la configuracion para este entorno
        run: |
          python3 - <<'EOF'
          import re, yaml
          from pathlib import Path
          p = Path("app/config.yaml"); t = p.read_text(encoding="utf-8")

          # Aqui no hay OneDrive: sin carpeta compartida el programa trabaja con su base local.
          t = re.sub(r'(?m)^(\s*carpeta_compartida:\s*).*$', r'\1""', t, count=1)
          # PLACSP tarda ~7 veces mas desde EE.UU. que desde Galicia. Aqui sobra tiempo: se amplia el tope.
          t = re.sub(r'(?m)^(\s*tiempo_max_segundos:\s*).*$', r'\g<1>1500', t, count=1)

          # El correo. En el config de la empresa avisos.activo va en false A PROPOSITO (los PCs no deben
          # mandar nada, o llegarian duplicados); aqui es justo al reves. Se toca SOLO el bloque avisos:
          # 'activo:' y 'proveedor:' aparecen tambien en bdns, boe, rss, licitaciones y publicacion.
          lineas, dentro = t.splitlines(), False
          for i, l in enumerate(lineas):
              if l.startswith("avisos:"):
                  dentro = True
                  continue
              if dentro:
                  if l and not l[0].isspace() and not l.startswith("#"):
                      break
                  sangria, s = l[:len(l) - len(l.lstrip())], l.strip()
                  if s.startswith("activo:"):
                      lineas[i] = sangria + "activo: true"
                  elif s.startswith("proveedor:"):
                      lineas[i] = sangria + "proveedor: smtp"
          t = "\n".join(lineas) + "\n"
          p.write_text(t, encoding="utf-8")

          c = yaml.safe_load(t)
          print("  avisos.activo    =", c["avisos"]["activo"])
          print("  avisos.proveedor =", c["avisos"]["proveedor"])
          print("  carpeta_compartida =", repr(c["general"]["carpeta_compartida"]))
          print("  tiempo_max_segundos =", c["licitaciones"]["tiempo_max_segundos"])
          # si algo de esto falla, mejor parar que rastrear en silencio sin mandar nada
          assert c["avisos"]["activo"] is True, "avisos.activo no ha quedado en true: no saldria ningun correo"
          assert c["avisos"]["proveedor"] == "smtp", "el proveedor no ha quedado en smtp"
          assert c["bdns"]["activo"] and c["licitaciones"]["activo"] and c["boe"]["activo"], \
              "se ha tocado un bloque que no era: el rastreo quedaria capado"
          EOF

      - name: Rastrear, generar el panel, publicar y avisar
        working-directory: app
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m rastreador.run

      - name: Aviso de ensayo (solo si se pide a mano)
        if: inputs.ensayo
        working-directory: app
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python -m rastreador.avisos --ensayo

      - name: Devolver la base a la rama datos
        if: always()
        run: |
          [ -f app/data/subvenciones.sqlite ] || { echo "no hay base que guardar"; exit 0; }
          gzip -9 -c app/data/subvenciones.sqlite > /tmp/nueva.gz
          ls -la /tmp/nueva.gz
          rm -rf /tmp/rama && mkdir /tmp/rama && cd /tmp/rama
          cp /tmp/nueva.gz subvenciones.sqlite.gz
          printf '# Rama `datos`\n\nBase de datos del Radar, comprimida. Se reescribe entera en cada\nejecucion (force push) para que el historial no crezca sin control.\nNo editar a mano: la genera .github/workflows/radar-diario.yml\n' > LEEME.md
          git init -q
          git config user.name "Radar GHC"
          git config user.email "radar@ghcneutral.com"
          git checkout -q -b datos
          git add .
          git commit -q -m "Base actualizada ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" datos
          echo "base devuelta a la rama datos"

      - name: Registro
        if: always()
        run: tail -60 app/data/rastreador.log || echo "(sin registro)"
